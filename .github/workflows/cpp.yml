name: C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # - name: Install GCC 14
    #   run: |
    #     sudo apt update
    #     sudo apt install -y gcc-14 g++-14

    - name: Testing
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
        cmake --build . --target test_dylib_lnx
        cmake --build . --target gh-actions